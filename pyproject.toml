[project]
name = "hdetect"
version = "0.1.0"
description = "Classical ML evaluator for hallucination detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.16.0",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "openai>=1.40",
    "pyarrow>=16",
    "pyyaml>=6",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8"]
features = [
    "pyserini==2.4.0",
    "sentence-transformers==6.1.0",
    "torch==2.11.0",
    "transformers==5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: needs Hugging Face access (deselected by default)",
    "models: needs the pinned feature models in the local Hugging Face cache",
]
